{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Home</h1>
    <div class="product-grid">
        <div class="card">
            <img src="{{ url_for('static', filename='pictures/mouse.png') }}" alt="mouse">
            <h2>Mouse</h2>
            <p class="green">Available</p>
            <p class="price">$15</p>
            <a href="{{ url_for('product') }}" class="btn">View</a>
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='pictures/keyboard.png') }}" alt="keyboard">
            <h2>Keyboard</h2>
            <p class="red">Not Available</p>
            <p class="price">$30</p>
            <a class="btn">View</a>
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='pictures/headphone.png') }}" alt="headphone">
            <h2>Headphone</h2>
            <p class="red">Not Available</p>
            <p class="price">$40</p>
            <a class="btn">View</a>
        </div>
        <div class="card">
            <img src="{{ url_for('static', filename='pictures/gamepad.png') }}" alt="gamepad">
            <h2>Gamepad</h2>
            <p class="red">Not Available</p>
            <p class="price">$50</p>
            <a class="btn">View</a>
        </div>
    </div>
</section>
{% endblock %}
