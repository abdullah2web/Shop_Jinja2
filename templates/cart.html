{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Cart</h1>
    <div class="cart-items">
        <div class="cart-card">
            <img src="{{ url_for('static', filename='pictures/mouse.png') }}" alt="mouse">
            <div>
                <h2>Mouse</h2>
                <p class="price">$15</p>
                <a href="{{ url_for('home') }}" class="btn remove-btn">Remove</a>
            </div>
        </div>
    </div>
    <div class="total">
        <h2>Total: $15</h2>
        <a href="{{ url_for('home') }}" class="btn">continue shopping</a>
        <a href="{{ url_for('home') }}" class="btn pay-btn">Pay</a>
    </div>
    <hr>
    <p>Your cart is empty.</p>
</section>
{% endblock %}
