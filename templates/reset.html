{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Reset Password</h1>
    <div class="product-grid">
        <div class="card">
            <form method="GET" action="">
                <div class="row">
                    <input class="bar" type="email" name="email" placeholder="Email" required>
                </div>
                <div class="row">
                    <input class="submit" type="submit" value="Reset Password">
                </div>
            </form>
            <a href="{{ url_for('login') }}" class="btn">Back</a>
        </div>
    </div>
</section>
{% endblock %}
