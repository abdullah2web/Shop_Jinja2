{% extends "layout.html" %}
{% block content %}
<section>
    <h1 class="title">Login</h1>
    <div class="product-grid">
        <div class="card">
            <form method="GET" action="">
                <div>
                    <img src="{{ url_for('static', filename='user.png') }}">
                </div>
                <div class="row">
                    <input class="bar" type="email" name="email" placeholder="Email" required>
                </div>
                <div class="row">
                    <input class="bar" type="password" name="password" placeholder="Password" required>
                </div>
                <div class="row">
                    <input type="checkbox"> <label for="remember">Remember Me</label>
                </div>
                <div class="row">
                    <input class="submit" type="submit" value="LogIn">
                </div>
                <div class="row">
                    <div class="ancor">
                        <a href="{{ url_for('reset') }}">Forgot Password?</a>
                    </div>
                </div>
            </form>
            <div class="ancor">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Rigister</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
